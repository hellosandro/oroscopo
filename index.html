<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Oroscopo</title>
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icone/favicon.png">
  <meta name="apple-mobile-web-app-title" content="Oroscopo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manuale:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Tema scelto dal footer (dark | light): applicato subito, prima che la pagina appaia
    try {
      const tema = localStorage.getItem("tema");
      if (tema) document.documentElement.dataset.tema = tema;
    } catch {}
  </script>
</head>
<body class="home">
  <main class="foglio" id="foglio">
    <button class="apri-menu" id="apri-menu" type="button" aria-label="Menu" aria-expanded="false">
      <svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true">
        <path class="linee" d="M14 36 H86 M14 64 H86"/>
        <path class="croce" d="M22 22 L78 78 M78 22 L22 78"/>
      </svg>
    </button>
    <h1 class="titolo"><span id="intestazione">Oroscopo di</span><br><span id="autore"></span><br><span class="data" id="settimana"></span></h1>
    <ul class="elenco" id="elenco"></ul>
    <!-- Menu del telefono: le voci sono disegnate come i segni -->
    <ul class="elenco menu" id="menu">
      <li><a href="#it" data-lingua="it"><span class="nome-segno">Italiano</span><svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"/><circle class="punto" cx="50" cy="50" r="13"/></svg></a></li>
      <li><a href="#en" data-lingua="en" lang="en"><span class="nome-segno">English</span><svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"/><circle class="punto" cx="50" cy="50" r="13"/></svg></a></li>
      <li><a href="#dark" data-tema="dark" lang="en"><span class="nome-segno">Dark</span><svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"/><circle class="punto" cx="50" cy="50" r="13"/></svg></a></li>
      <li><a href="#light" data-tema="light" lang="en"><span class="nome-segno">Light</span><svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"/><circle class="punto" cx="50" cy="50" r="13"/></svg></a></li>
      <li><a href="info"><span class="nome-segno">Info</span><svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true"><circle class="punto-i" cx="46" cy="16" r="6"/><path d="M34 40 H46 V74 C46 86 56 90 70 86"/></svg></a></li>
    </ul>
  </main>
  <footer class="lingue" id="lingue">
    <a href="#en" data-lingua="en" lang="en">english</a> | <a href="#it" data-lingua="it">italiano</a>
    <span class="tema"><a href="#dark" data-tema="dark" lang="en">dark</a> | <a href="#light" data-tema="light" lang="en">light</a></span>
    <a class="link-nota" id="link-nota" href="info">info</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Oroscopo</title>
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icone/favicon.png">
  <meta name="apple-mobile-web-app-title" content="Oroscopo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manuale:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Tema scelto dal footer (dark | light): applicato subito, prima che la pagina appaia
    try {
      const tema = localStorage.getItem("tema");
      if (tema) document.documentElement.dataset.tema = tema;
    } catch {}
  </script>
</head>
<body class="home">
  <main class="foglio" id="foglio">
    <h1 class="titolo"><span id="intestazione">Oroscopo di</span><br><span id="autore"></span><br><span class="data" id="settimana"></span></h1>
    <ul class="elenco" id="elenco"></ul>
  </main>
  <footer class="lingue" id="lingue">
    <a href="#en" data-lingua="en" lang="en">english</a> | <a href="#it" data-lingua="it">italiano</a>
    <span class="tema"><a href="#dark" data-tema="dark" lang="en">dark</a> | <a href="#light" data-tema="light" lang="en">light</a></span>
    <a class="link-nota" id="link-nota" href="nota">note</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
